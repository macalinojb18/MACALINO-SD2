<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Hyperlinks and Attributes</title>
</head>
<body>
    <!-- Hyperlinks -->
     <!-- 1. Relative Link - These are links located located in the local folder. -->
    
     <div align="center">
        <h1>Relative Links</h1>

        <a href="./sample1.html">Go to sample 1</a>
        <br>
        <a href="./music/music.html">Go Music Page</a>
        <br>
        <a href="./photo/photo.html">Photo Page</a> 
        <br>
        <a href="./photo/logo/logo.html">Go to Logo Page</a>

        <h3> Relative Link for Image</h3>

        <!-- Attributes -changes the original properties of an element. -->
        <img src="https://i.pinimg.com/736x/0c/25/d8/0c25d887856e75f31846f877b390bef4.jpg" alt="kirby" width="200" height="200"> 

        <h3>Absolute Link for Image</h3>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Zombie_zoya.jpg/250px-Zombie_zoya.jpg" alt="cat image" width="200" height="auto">
    </div>

</body>
</html>
